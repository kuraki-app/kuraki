# Kuraki — one-command self-hosting (simple local host, plain HTTP).
#
#   docker compose up -d      # build + start, then open http://localhost:39170
#
# One container, one process: `kuraki serve` on :39170 serves the API, media, and
# the web UI (including first-run admin setup) from a single origin.
#
# Your photos live in ./kuraki-data (originals/, derivatives/, the
# SQLite DB, and pre-migration snapshots) — back that directory up and you have
# your whole library. Point an optional watch folder at anything Syncthing syncs.
#
# Exposing Kuraki to the internet? Use deploy/docker-compose.caddy.yml instead —
# it adds automatic HTTPS via Caddy and the production security settings. See
# DEPLOYMENT.md.

services:
  kuraki:
    build:
      context: .
      args:
        VERSION: compose
    image: ghcr.io/kuraki-app/kuraki:latest
    container_name: kuraki
    restart: unless-stopped
    ports:
      # Host and container both 39170 — see internal/config/ports.go for why not
      # 3000. Change only the left half if the host port is taken.
      - "39170:39170"   # Go server: API + media + web UI
    volumes:
      - ./kuraki-data:/data
      # Optional: mount a folder Syncthing/rsync writes into, then run
      #   docker compose exec kuraki kuraki import /inbox --watch
      # - ./inbox:/inbox:ro
    environment:
      KURAKI_DATA_DIR: /data
      KURAKI_ADDR: ":39170"
      # The address a phone should connect to. A container can only see its own
      # bridge interface, so it cannot work this out for itself — without this
      # the Devices page falls back to whatever address your browser is using.
      # KURAKI_PUBLIC_URL: "http://192.168.1.20:39170"
