# Kuraki — one-command self-hosting (simple local host, plain HTTP).
#
#   docker compose up -d      # build + start, then open a URL below
#
# One container, two origins:
#   • http://localhost:3000   Go API + media, plus the embedded UI (canonical)
#   • http://localhost:8080   SvelteKit UI served by Caddy, proxying /api to :3000
# Both serve the working app; :8080 is the split UI origin, :3000 is the API.
#
# Your photos live in ./kuraki-data (originals/, derivatives/, the
# SQLite DB, and pre-migration snapshots) — back that directory up and you have
# your whole library. Point an optional watch folder at anything Syncthing syncs.
#
# Exposing Kuraki to the internet? Use deploy/docker-compose.caddy.yml instead —
# it adds automatic HTTPS via Caddy and the production security settings. See
# DEPLOYMENT.md.

services:
  kuraki:
    build:
      context: .
      args:
        VERSION: compose
    image: ghcr.io/kuraki-app/kuraki:latest
    container_name: kuraki
    restart: unless-stopped
    ports:
      - "3000:3000"   # Go API + media (and embedded UI)
      - "8080:8080"   # SvelteKit UI (Caddy), proxies /api -> :3000
    volumes:
      - ./kuraki-data:/data
      # Optional: mount a folder Syncthing/rsync writes into, then run
      #   docker compose exec kuraki kuraki import /inbox --watch
      # - ./inbox:/inbox:ro
    environment:
      KURAKI_DATA_DIR: /data
      KURAKI_ADDR: ":3000"
