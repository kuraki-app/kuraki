appId: app.kuraki.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Your photos. Your server."
    timeout: 30000
- tapOn: "Get started"
- tapOn: "Kuraki server address"
- inputText: "${SERVER_URL}"
# iOS keyboard hiding uses layout-dependent swipes. An unhandled heading tap
# dismisses it without accidentally scrolling the next action out of view.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Find your server"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
    timeout: 30000
- takeScreenshot: server-form
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Link this phone"
    timeout: 30000
- tapOn: "Pairing code"
- inputText: "${PAIR_CODE}"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Link this phone"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      text: "Pair with code"
    direction: DOWN
    timeout: 30000
- takeScreenshot: pairing-form
- tapOn: "Pair with code"
- extendedWaitUntil:
    visible: "Allow photo access"
    timeout: 30000
- tapOn: "Finish without access"
- extendedWaitUntil:
    visible: "Photos"
    timeout: 30000
- tapOn: "Collections"
- assertVisible: "ALBUMS"
- tapOn: "Settings"
- assertVisible: "Backup"
- tapOn: "Search"
- assertVisible: "Search"
- tapOn: "Settings"
- tapOn: ".*Backup.*"
- tapOn: ".*Back up now.*"
- runFlow:
    when:
      platform: iOS
      visible: ".*Allow Full Access.*"
    commands:
      - tapOn: ".*Allow Full Access.*"
- runFlow:
    when:
      platform: Android
      visible: ".*Allow all.*"
    commands:
      - tapOn: ".*Allow all.*"
- extendedWaitUntil:
    visible: ".*All caught up.*"
    timeout: 120000

- stopApp
- launchApp
- assertVisible: "Photos"
