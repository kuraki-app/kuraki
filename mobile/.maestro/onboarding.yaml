appId: app.kuraki.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Your photos. Your server."
    timeout: 30000
- tapOn: "Get started"
- tapOn: "Kuraki server address"
- inputText: "${SERVER_URL}"
- hideKeyboard
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Link this phone"
    timeout: 30000
- tapOn: "Pairing code"
- inputText: "${PAIR_CODE}"
- hideKeyboard
- tapOn: "Pair with code"
- extendedWaitUntil:
    visible: "Allow photo access"
    timeout: 30000
- tapOn: "Finish without access"
- extendedWaitUntil:
    visible: "Photos"
    timeout: 30000
- tapOn: "Collections"
- assertVisible: "ALBUMS"
- tapOn: "Settings"
- assertVisible: "Backup"
- tapOn: "Search"
- assertVisible: "Search"
- tapOn: "Settings"
- tapOn: ".*Backup.*"
- tapOn: ".*Back up now.*"
- runFlow:
    when:
      platform: iOS
      visible: ".*Allow Full Access.*"
    commands:
      - tapOn: ".*Allow Full Access.*"
- runFlow:
    when:
      platform: Android
      visible: ".*Allow all.*"
    commands:
      - tapOn: ".*Allow all.*"
- extendedWaitUntil:
    visible: ".*All caught up.*"
    timeout: 120000

- stopApp
- launchApp
- assertVisible: "Photos"
