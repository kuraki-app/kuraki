name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please fill this out so it can be reproduced quickly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, plus what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `kuraki serve ...`
        2. Import `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant structured log output (redact anything sensitive).
      render: shell
  - type: dropdown
    id: install
    attributes:
      label: How did you install Kuraki?
      options:
        - Binary
        - Docker
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `kuraki version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform / architecture
      placeholder: e.g. Linux x86_64 / arm64, Docker
    validations:
      required: true
  - type: checkboxes
    id: data-safety
    attributes:
      label: Data safety
      options:
        - label: This bug affected or modified my original files
        - label: I have a backup of the affected data
