name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...

  links:
    name: Docs links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every advertised install path was broken at once — the clone URL, the
      # CI badge, and the image path — and nothing caught it, because none of
      # them is type-checked or exercised by a test. This job is the check.
      - run: scripts/check-docs-links.sh

  contract:
    name: API contract up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Regenerates the OpenAPI spec + both client type files and fails if they
      # differ from what is committed, so handler/apitypes edits can't ship with
      # stale generated clients. Generator versions are pinned in the Makefile.
      - run: make check-gen

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      # `npm run build` does NOT typecheck (Vite strips types; plain tsc skips
      # .svelte files), so svelte-check is the only real type gate for web.
      - run: cd web && npm run check
      - run: cd web && npm run build

  mobile:
    name: Mobile typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: cd mobile && npm ci
      - run: cd mobile && npx tsc --noEmit
      - run: cd mobile && npx expo lint
      - run: cd mobile && npm run test
      - run: cd mobile && npm run check-tokens

  build:
    name: Cross-compile (pure-Go)
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="kuraki-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && out="${out}.exe"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${out}" ./cmd/kuraki
      # The Build step above is the actual gate; these binaries are a
      # convenience. Uploading four of them on every push to main with the
      # default 90-day retention exhausted the repository's artifact storage
      # quota, which failed this job even though every target compiled. Branch
      # builds now expire in a week; tag builds are real release artifacts and
      # keep the full retention.
      - uses: actions/upload-artifact@v4
        with:
          name: kuraki-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only — this job proves the image still builds. Publishing moved to
      # release.yml so exactly one workflow produces artifacts people can run.
      # It previously pushed on tags, which is why nothing here ever created the
      # `:latest` tag the README advertises.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # On PRs github.ref_name is "<n>/merge" — the slash is an invalid
          # Docker tag and fails the build even though nothing is pushed.
          tags: ghcr.io/${{ github.repository }}:ci
          build-args: |
            VERSION=ci-${{ github.sha }}

  media-vips:
    name: Media contract (libvips build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install media build dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev pkg-config ffmpeg
      - name: Test tagged backend
        run: CGO_ENABLED=1 go test -race -tags vips ./...
