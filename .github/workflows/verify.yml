name: Verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: python3 scripts/check-deployment-test.py
      - name: Reachable Go vulnerability gate
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  links:
    name: Docs links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every advertised install path was broken at once — the clone URL, the
      # CI badge, and the image path — and nothing caught it, because none of
      # them is type-checked or exercised by a test. This job is the check.
      - run: scripts/check-docs-links.sh

  contract:
    name: API contract up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Regenerates the OpenAPI spec + both client type files and fails if they
      # differ from what is committed, so handler/apitypes edits can't ship with
      # stale generated clients. Generator versions are pinned in the Makefile.
      - run: make check-gen

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      # `npm run build` does NOT typecheck (Vite strips types; plain tsc skips
      # .svelte files), so svelte-check is the only real type gate for web.
      - run: cd web && npm run check
      # Pure-logic unit tests (date grouping, the taken_day timezone fix, file
      # sizes). They run in America/Los_Angeles — see vitest.config.ts — because
      # the timezone bug they pin is invisible at UTC or any positive offset.
      - run: cd web && npm run test
      - run: cd web && npm audit --audit-level=low
      - run: cd web && npm run build
      # Keep the static SPA lightweight: this measures the resources referenced
      # by the fallback document, the largest lazy chunk, and bundled fonts
      # after Vite has produced the exact assets shipped in the Go binary.
      - run: node scripts/check-web-budget.mjs

  e2e:
    name: Web end-to-end (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx playwright install --with-deps chromium
      # `make e2e` is `web` + `build` + the suite, in that order, so the binary
      # under test embeds the UI built from THIS commit rather than the assets
      # that happen to be committed. e2e/server.mjs refuses to run if web/src is
      # newer than the binary, which is what keeps that ordering honest.
      - run: make e2e
      # `internal/httpapi/assets` is COMMITTED (go:embed needs it in the tree)
      # and nothing checked it against a fresh build: `make check-gen` covers the
      # OpenAPI contract and client types, not the embedded UI. So the committed
      # UI could drift from web/ silently, and a `go build` with no `make web`
      # would embed whatever was last committed. `make e2e` has just rebuilt it,
      # so any diff here means the commit carries a stale UI.
      #
      # Node is pinned to 24 across every web job (and .nvmrc) so this compares
      # like with like — Vite's content hashes are deterministic for identical
      # inputs, but "identical" includes the toolchain that produced them.
      - name: Embedded UI matches web/
        # Byte-for-byte except precompressed .gz, whose bytes differ between
        # macOS and Linux zlib; those must decompress to their source instead.
        run: scripts/check-embedded-ui.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/e2e/.tmp/results
          retention-days: 7

  mobile:
    name: Mobile safety, compatibility & security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: cd mobile && npm ci
      - run: cd mobile && npm run audit:security
      # Validate the installed SDK's bundled matrix, not a mutable latest-patch
      # endpoint. The independent security audit above still queries live data.
      - run: cd mobile && npm run check:compatibility
        env:
          EXPO_OFFLINE: '1'
      - run: cd mobile && npx tsc --noEmit
      - run: cd mobile && npx expo lint
      - run: cd mobile && npm run test
      - run: cd mobile && npm run check-design

  mobile-native:
    name: Native mobile verification
    needs: mobile
    uses: ./.github/workflows/mobile-native.yml

  build:
    name: Cross-compile (pure-Go)
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="kuraki-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && out="${out}.exe"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${out}" ./cmd/kuraki
      # The Build step above is the actual gate; these binaries are a
      # convenience. Uploading four of them on every push to main with the
      # default 90-day retention exhausted the repository's artifact storage
      # quota, which failed this job even though every target compiled. Branch
      # builds now expire in a week; tag builds are real release artifacts and
      # keep the full retention.
      - uses: actions/upload-artifact@v4
        with:
          name: kuraki-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Verify the exact image locally before any release workflow can publish.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          # On PRs github.ref_name is "<n>/merge" — the slash is an invalid
          # Docker tag and fails the build even though nothing is pushed.
          tags: ghcr.io/${{ github.repository }}:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
      - name: Image recovery smoke test
        run: scripts/smoke-deployment.sh ghcr.io/${{ github.repository }}:ci
      - name: Private HTTPS proxy smoke test
        run: scripts/smoke-proxy.sh ghcr.io/${{ github.repository }}:ci
      - name: Image vulnerability gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  media-vips:
    name: Media contract (libvips build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install media build dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev pkg-config ffmpeg
      - name: Test tagged backend
        run: CGO_ENABLED=1 go test -race -tags vips ./...
