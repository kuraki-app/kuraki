<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14120e" />
    <script>
      // Set the `.dark` class before first paint so there is no flash of the
      // wrong theme. mode-watcher (in the layout) owns it afterwards; this reads
      // the same persisted key. 'system' (or unset) follows the OS preference.
      try {
        var m = localStorage.getItem('mode-watcher-mode') || 'system';
        var dark = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
